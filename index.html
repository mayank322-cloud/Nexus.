<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS AI</title>
    <style>
        /* Modern, Futuristic Dark Theme Styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Top Header */
        header {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(59, 130, 246, 0.2);
            padding: 15px;
            text-align: center;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        /* Chat History Stream */
        .chat-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 15px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .bot-message {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(59, 130, 246, 0.2);
            color: #ffffff;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .user-message {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .attachment-preview {
            max-width: 150px;
            max-height: 150px;
            border-radius: 8px;
            margin-top: 8px;
            display: block;
        }

        /* Bottom Input Bar Configuration */
        .input-bar {
            background: rgba(15, 23, 42, 0.9);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* The Custom '+' Attachment Button */
        .plus-btn {
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.4);
            color: #3b82f6;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 1.8rem;
            font-weight: 400;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .plus-btn:hover {
            background: rgba(59, 130, 246, 0.4);
        }

        .plus-btn:active {
            transform: scale(0.95);
        }

        /* Text Input Box */
        .chat-input {
            flex: 1;
            height: 45px;
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            padding: 0 20px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .chat-input:focus {
            border-color: #3b82f6;
        }

        /* Send Button */
        .send-btn {
            background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
        }

        /* Hidden File Input */
        #file-input {
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>NEXUS AI</h1>
        <p class="subtitle">Custom Interface Mode</p>
    </header>

    <!-- Chat display area -->
    <div class="chat-container" id="chat-container">
        <div class="message bot-message">
            Hello! I am NEXUS. Tap the "+" icon to add a file, or type a message below to start chatting!
        </div>
    </div>

    <!-- Hidden file handler trigger -->
    <input type="file" id="file-input" accept="image/*,application/pdf,video/*">

    <!-- Bottom Actions bar -->
    <div class="input-bar">
        <!-- Trigger Button for Attachments -->
        <button class="plus-btn" onclick="triggerUpload()">+</button>
        
        <input type="text" class="chat-input" id="chat-msg" placeholder="Type a message...">
        
        <button class="send-btn" onclick="sendMessage()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
        </button>
    </div>

    <script>
        const fileInput = document.getElementById('file-input');
        const chatContainer = document.getElementById('chat-container');
        const chatMsg = document.getElementById('chat-msg');
        let selectedFileBase64 = null;

        // Triggers phone gallery / file system
        function triggerUpload() {
            fileInput.click();
        }

        // Handles selected file from user phone
        fileInput.addEventListener('change', function() {
            if (this.files && this.files[0]) {
                const file = this.files[0];
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    selectedFileBase64 = e.target.result;
                    alert("Attached file: " + file.name + " ready to send!");
                }
                
                reader.readAsDataURL(file);
            }
        });

        // Appends messages inside user view
        function sendMessage() {
            const text = chatMsg.value.trim();
            if (!text && !selectedFileBase64) return;

            // 1. Render User Message inside window
            const userDiv = document.createElement('div');
            userDiv.className = 'message user-message';
            
            if (text) {
                userDiv.textContent = text;
            }
            
            // Render small image preview if an image was added
            if (selectedFileBase64 && selectedFileBase64.startsWith('data:image')) {
                const img = document.createElement('img');
                img.src = selectedFileBase64;
                img.className = 'attachment-preview';
                userDiv.appendChild(img);
            } else if (selectedFileBase64) {
                const docText = document.createElement('div');
                docText.style.fontSize = '0.8rem';
                docText.style.marginTop = '5px';
                docText.textContent = "📁 [Document Attached]";
                userDiv.appendChild(docText);
            }

            chatContainer.appendChild(userDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Clear inputs
            chatMsg.value = '';
            selectedFileBase64 = null;
            fileInput.value = '';

            // 2. Simulated Bot Response (Ready for AI API Connection)
            setTimeout(() => {
                const botDiv = document.createElement('div');
                botDiv.className = 'message bot-message';
                botDiv.textContent = "I received your message! To make me process this information automatically, we just need to link a free API token next.";
                chatContainer.appendChild(botDiv);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }, 800);
        }
    </script>

</body>
</html>
