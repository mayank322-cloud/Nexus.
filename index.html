<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS</title>
    <!-- Material Icons Link for Gemini Style Accent Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <style>
        /* Exact Google Gemini Layout Colors and Specs */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Google Sans', 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background-color: #131314;
            color: #e3e3e3;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* 📁 Left Sidebar Navigation */
        .sidebar {
            width: 256px;
            background-color: #1e1f20;
            display: flex;
            flex-direction: column;
            padding: 12px;
            justify-content: space-between;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        @media (max-width: 768px) {
            .sidebar { width: 0px; padding: 0px; overflow: hidden; }
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 24px;
            cursor: pointer;
            color: #c4c7c5;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .menu-item:hover {
            background-color: #282a2c;
        }

        /* 🚀 Main Interface Workspace */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            background-color: #131314;
        }

        /* Top Bar Branding Navigation */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background-color: #131314;
        }

        .brand-container {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .brand-title {
            font-size: 1.4rem;
            font-weight: 500;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-logo-spark {
            background: linear-gradient(135deg, #4285f4, #9b51e0, #e94235);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        .version-badge {
            font-size: 0.7rem;
            color: #80868b;
            letter-spacing: 1px;
            font-weight: bold;
            padding-left: 2px;
        }

        /* Secure Key Input Container Inside Top Bar */
        .key-input-wrapper {
            background: #1e1f20;
            border-radius: 18px;
            padding: 4px 12px;
            display: flex;
            align-items: center;
            border: 1px solid #444746;
        }

        .key-field {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 0.8rem;
            width: 180px;
        }

        /* 🌟 Middle Welcome Screen */
        .welcome-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            width: 100%;
        }

        .greeting {
            font-size: 3.5rem;
            font-weight: 500;
            line-height: 1.2;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #4285f4 0%, #9b51e0 40%, #e94235 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sub-greeting {
            font-size: 3.5rem;
            font-weight: 500;
            color: #444746;
            line-height: 1.2;
            margin-bottom: 40px;
        }

        /* 💬 Real-Time Multi-turn Chat Container Viewport */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            max-width: 820px;
            width: 100%;
            margin: 0 auto;
            padding: 20px;
            display: none; 
            flex-direction: column;
            gap: 32px;
        }

        .chat-row {
            display: flex;
            gap: 16px;
            align-items: flex-start;
            width: 100%;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .user-avatar {
            background-color: #9b51e0;
            color: #fff;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .nexus-avatar {
            background: linear-gradient(135deg, #4285f4, #9b51e0);
            color: white;
        }

        .bubble-content {
            flex: 1;
            color: #e3e3e3;
            font-size: 1rem;
            line-height: 1.6;
            word-wrap: break-word;
            padding-top: 4px;
        }

        .attachment-preview {
            max-width: 300px;
            border-radius: 12px;
            margin-top: 12px;
            border: 1px solid #444746;
            display: block;
        }

        /* Camera Feed Overlay Window */
        .camera-viewport-card {
            width: 200px;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #4285f4;
            position: absolute;
            top: 90px;
            right: 40px;
            display: none;
            background: #000;
            z-index: 10;
        }

        #webcam-stream {
            width: 100%;
            display: block;
            transform: scaleX(-1);
        }

        /* 💊 Bottom Floating Chat Pill Input Panel */
        .input-area-wrapper {
            width: 100%;
            max-width: 820px;
            margin: 0 auto;
            padding: 0 20px 24px 20px;
            background-color: #131314;
        }

        .input-pill-box {
            background-color: #1e1f20;
            border-radius: 32px;
            padding: 8px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid transparent;
            transition: border 0.2s;
        }

        .input-pill-box:focus-within {
            border-color: #444746;
            background-color: #282a2c;
        }

        .main-text-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #e3e3e3;
            font-size: 1rem;
            height: 48px;
        }

        .main-text-input::placeholder {
            color: #80868b;
        }

        .control-btn {
            background: transparent;
            border: none;
            color: #c4c7c5;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, color 0.2s;
        }

        .control-btn:hover {
            background-color: #2f3032;
            color: #fff;
        }

        .control-btn.active-mic {
            color: #ea4335;
            background-color: rgba(234, 67, 53, 0.15);
        }

        .control-btn.active-cam {
            color: #34a853;
            background-color: rgba(52, 168, 83, 0.15);
        }

        .bottom-disclaimer {
            text-align: center;
            font-size: 0.75rem;
            color: #80868b;
            margin-top: 12px;
        }

        #file-selector { display: none; }

        /* Smooth Google Typing Loader Wave Animations */
        .gemini-loader {
            display: flex;
            gap: 6px;
            align-items: center;
            padding-top: 8px;
        }
        .gemini-loader span {
            width: 8px;
            height: 8px;
            background: linear-gradient(135deg, #4285f4, #9b51e0);
            border-radius: 50%;
            display: inline-block;
            animation: wave 1.2s infinite ease-in-out both;
        }
        .gemini-loader span:nth-child(1) { animation-delay: -0.32s; }
        .gemini-loader span:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes wave {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-8px); }
        }
    </style>
</head>
<body>

    <!-- Left Context Navigation Drawer -->
    <div class="sidebar">
        <div>
            <div class="menu-item" style="margin-bottom: 20px; background: #2f3032; color: #fff;">
                <span class="material-icons-outlined">add</span>
                <span>New chat</span>
            </div>
            <div class="menu-item">
                <span class="material-icons-outlined">history</span>
                <span>Activity</span>
            </div>
        </div>
        <div>
            <div class="menu-item">
                <span class="material-icons-outlined">settings</span>
                <span>Settings</span>
            </div>
        </div>
    </div>

    <!-- Right Interaction Space Layout -->
    <div class="main-content">
        <header>
            <div class="brand-container">
                <div class="brand-title">
                    <span>Nexus</span>
                    <span class="brand-logo-spark">✦</span>
                </div>
                <div class="version-badge">v1.5.3</div>
            </div>
            <div class="key-input-wrapper">
                <span class="material-icons-outlined" style="font-size:16px; color:#80868b; margin-right:6px;">vpn_key</span>
                <input type="password" class="key-field" id="nexus-vault-key" placeholder="Enter API Key credential...">
            </div>
        </header>

        <!-- Camera Monitoring Component Frame -->
        <div class="camera-viewport-card" id="cam-card">
            <video id="webcam-stream" autoplay playsinline muted></video>
        </div>

        <!-- Dynamic Content Landing Center Matrix -->
        <div class="welcome-screen" id="welcome-container">
            <h2 class="greeting">Hello, M. Gupta</h2>
            <h2 class="sub-greeting">How can I help you today?</h2>
        </div>

        <!-- Chat Stream Workspace Panel -->
        <div class="chat-container" id="message-stream"></div>

        <!-- Interactive Control Pill Deck Box -->
        <div class="input-area-wrapper">
            <div class="input-pill-box">
                <!-- Media Plus Action Button -->
                <button class="control-btn" onclick="window.openFilePicker()">
                    <span class="material-icons-outlined" id="plus-icon">add_photo_alternate</span>
                </button>
                <input type="file" id="file-selector" accept="image/*">
                
                <input type="text" class="main-text-input" id="prompt-input" placeholder="Message Nexus...">
                
                <!-- Webcam Streaming Overlay Button -->
                <button class="control-btn" id="cam-toggle" onclick="window.toggleWebcamMedia()">
                    <span class="material-icons-outlined">videocam</span>
                </button>
                
                <!-- Live Voice Mode Button -->
                <button class="control-btn" id="mic-toggle" onclick="window.toggleAudioSocketLink()">
                    <span class="material-icons-outlined">mic</span>
                </button>
                
                <!-- Send Execution Action Button -->
                <button class="control-btn" style="color: #4285f4;" onclick="window.executePromptSend()">
                    <span class="material-icons-outlined">send</span>
                </button>
            </div>
            <div class="bottom-disclaimer">
                Nexus can make mistakes, so double-check its outputs.
            </div>
        </div>
    </div>

    <script type="module">
        import { GoogleGenAI } from "https://esm.run/@google/genai";

        const fileSelector = document.getElementById('file-selector');
        const plusIcon = document.getElementById('plus-icon');
        const micToggle = document.getElementById('mic-toggle');
        const camToggle = document.getElementById('cam-toggle');
        const welcomeContainer = document.getElementById('welcome-container');
        const messageStream = document.getElementById('message-stream');
        const promptInput = document.getElementById('prompt-input');
        const vaultKey = document.getElementById('nexus-vault-key');
        const camCard = document.getElementById('cam-card');
        const webcamStream = document.getElementById('webcam-stream');
        
        let selectedFileBase64 = null;
        let selectedMimeType = null;
        
        let liveSocket = null;
        let audioContext = null;
        let mediaStream = null;
        let videoStream = null;
        let processorNode = null;
        let isLiveActive = false;
        let isCamActive = false;
        let videoFrameLoopToken = null;

        const frameCanvas = document.createElement('canvas');
        const frameCanvasCtx = frameCanvas.getContext('2d');

        const SYSTEM_INSTRUCTION = "You are NEXUS AI, a smart multimodal AI assistant. Your inventor/creator is M. Gupta (also known as Mayank). He is a school student who runs a YouTube channel (@MTB.mayank_7) focused on mountain biking edits, bicycle stunts, and mechanical repairs. He is also a DIY electronics hobbyist who builds robotics projects (like Arduino Uno sensor-based models). Keep your answers helpful, cool, and acknowledge your inventor proudly if asked.";

        if(localStorage.getItem('nexus_vault_token')) {
            vaultKey.value = localStorage.getItem('nexus_vault_token');
        }

        vaultKey.addEventListener('input', () => {
            localStorage.setItem('nexus_vault_token', vaultKey.value.trim());
        });

        function retrieveToken() {
            return vaultKey.value.trim();
        }

        // Global functions mapped explicitly to the window scope
        window.openFilePicker = function() {
            fileSelector.click();
        }

        fileSelector.addEventListener('change', function() {
            if (this.files && this.files[0]) {
                const file = this.files[0];
                selectedMimeType = file.type || "image/jpeg";
                
                const reader = new FileReader();
                reader.onload = function(e) {
                    selectedFileBase64 = e.target.result;
                    plusIcon.textContent = "check_circle";
                    plusIcon.style.color = "#34a853";
                }
                reader.readAsDataURL(file);
            }
        });

        window.toggleWebcamMedia = async function() {
            if (isCamActive) {
                disableCameraTracks();
                return;
            }
            try {
                videoStream = await navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 240 } });
                webcamStream.srcObject = videoStream;
                camCard.style.display = 'block';
                camToggle.classList.add('active-cam');
                isCamActive = true;
                
                if (isLiveActive && liveSocket && liveSocket.readyState === WebSocket.OPEN) {
                    initializeFramePipelineLoop();
                }
            } catch (err) {
                console.error(err);
                alert("Camera track access failure.");
            }
        }

        function disableCameraTracks() {
            isCamActive = false;
            camToggle.classList.remove('active-cam');
            if (videoFrameLoopToken) { clearInterval(videoFrameLoopToken); videoFrameLoopToken = null; }
            if (videoStream) { videoStream.getTracks().forEach(track => track.stop()); videoStream = null; }
            webcamStream.srcObject = null;
            camCard.style.display = 'none';
        }

        function initializeFramePipelineLoop() {
            if (videoFrameLoopToken) clearInterval(videoFrameLoopToken);
            videoFrameLoopToken = setInterval(() => {
                if (!isLiveActive || !isCamActive || liveSocket.readyState !== WebSocket.OPEN) return;
                
                frameCanvas.width = 240;
                frameCanvas.height = 180;
                frameCanvasCtx.drawImage(webcamStream, 0, 0, frameCanvas.width, frameCanvas.height);
                
                const dataUrl = frameCanvas.toDataURL('image/jpeg', 0.5);
                const pureFrameBase64 = dataUrl.split(',')[1];

                liveSocket.send(JSON.stringify({
                    realtimeInput: {
                        mediaChunks: [{ mimeType: "image/jpeg", data: pureFrameBase64 }]
                    }
                }));
            }, 800);
        }

        window.toggleAudioSocketLink = async function() {
            const KEY = retrieveToken();
            if(!KEY) { alert("Please input your API token credential map first."); return; }

            if (isLiveActive) {
                shutdownLiveSession("Nexus Live session closed.");
                return;
            }

            welcomeContainer.style.display = 'none';
            messageStream.style.display = 'flex';
            appendInterfaceLog("System: Activating Nexus Live session interface...", "nexus");
            
            micToggle.classList.add('active-mic');
            isLiveActive = true;

            try {
                const wsUrl = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=${KEY}`;
                liveSocket = new WebSocket(wsUrl);

                liveSocket.onopen = () => {
                    appendInterfaceLog("✦ Nexus Live connected. Streaming initialization parameters...", "nexus");
                    liveSocket.send(JSON.stringify({
                        setup: {
                            model: "models/gemini-2.5-flash",
                            responseModalities: ["AUDIO"],
                            speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Puck" } } }
                        }
                    }));
                    startMicrophoneCapture();
                    if (isCamActive) initializeFramePipelineLoop();
                };

                liveSocket.onmessage = async (event) => {
                    const response = JSON.parse(event.data);
                    if (response.serverContent?.modelTurn?.parts) {
                        for (const part of response.serverContent.modelTurn.parts) {
                            if (part.inlineData && part.inlineData.data) {
                                playReceivedAudioChunk(part.inlineData.data);
                            }
                        }
                    }
                };

                liveSocket.onerror = () => shutdownLiveSession("Nexus Live channel error.");
                liveSocket.onclose = () => { if(isLiveActive) shutdownLiveSession("Nexus Live channel closed."); };

            } catch (e) {
                console.error(e);
                shutdownLiveSession("Audio setup capture failure.");
            }
        }

        async function startMicrophoneCapture() {
            audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
            mediaStream = await navigator.mediaDevices.getUs
