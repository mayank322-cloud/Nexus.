<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS AI</title>
    <style>
        /* Modern, Futuristic Dark Theme Styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(59, 130, 246, 0.2);
            padding: 15px;
            text-align: center;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        .chat-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 15px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .bot-message {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(59, 130, 246, 0.2);
            color: #ffffff;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .user-message {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .attachment-preview {
            max-width: 200px;
            max-height: 200px;
            border-radius: 8px;
            margin-top: 8px;
            display: block;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .input-bar {
            background: rgba(15, 23, 42, 0.9);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .action-btn {
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.4);
            color: #3b82f6;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 1.4rem;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        .plus-btn.attached {
            background: rgba(16, 185, 129, 0.2);
            border-color: rgba(16, 185, 129, 0.4);
            color: #10b981;
        }

        .mic-btn.live-active {
            background: rgba(239, 68, 68, 0.3);
            border-color: #ef4444;
            color: #ef4444;
            animation: pulse-mic 1.5s infinite alternate;
        }

        .chat-input {
            flex: 1;
            height: 45px;
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            padding: 0 20px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
        }

        .chat-input:focus {
            border-color: #3b82f6;
        }

        .send-btn {
            background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
        }

        #file-input {
            display: none;
        }

        .typing-loader {
            display: flex;
            gap: 5px;
            align-items: center;
            height: 20px;
        }
        .typing-loader span {
            width: 8px;
            height: 8px;
            background-color: #94a3b8;
            border-radius: 50%;
            display: inline-block;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing-loader span:nth-child(1) { animation-delay: -0.32s; }
        .typing-loader span:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        @keyframes pulse-mic {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            100% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<body>

    <header>
        <h1>NEXUS AI</h1>
        <p class="subtitle">Custom Live Multimodal Mode</p>
    </header>

    <div class="chat-container" id="chat-container">
        <div class="message bot-message">
            Hello! I am NEXUS. You can send text/photos below, or click the Microphone icon to start a NEXUS Live real-time voice conversation session!
        </div>
    </div>

    <input type="file" id="file-input" accept="image/*">

    <div class="input-bar">
        <button class="action-btn plus-btn" id="plus-btn" onclick="triggerUpload()">+</button>
        <button class="action-btn mic-btn" id="mic-btn" onclick="toggleLiveAudio()">🎙️</button>
        <input type="text" class="chat-input" id="chat-msg" placeholder="Type a message...">
        <button class="send-btn" onclick="sendMessage()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
        </button>
    </div>

    <script>
        const API_KEY = "AQ.Ab8RN6KG0wmxNaKZttYgMeinuCYUwG3X5W_DUzSIRfRdmKPqjg";
        
        const SYSTEM_INSTRUCTION = "You are NEXUS AI, a smart multimodal AI assistant. Your inventor/creator is M. Gupta (also known as Mayank). He is a school student who runs a YouTube channel (@MTB.mayank_7) focused on mountain biking edits, bicycle stunts, and mechanical repairs. He is also a DIY electronics hobbyist who builds robotics projects (like Arduino Uno sensor-based models). Keep your answers helpful, cool, and acknowledge your inventor proudly if asked.";

        const fileInput = document.getElementById('file-input');
        const plusBtn = document.getElementById('plus-btn');
        const micBtn = document.getElementById('mic-btn');
        const chatContainer = document.getElementById('chat-container');
        const chatMsg = document.getElementById('chat-msg');
        
        let selectedFileBase64 = null;
        let selectedMimeType = null;
        
        let liveSocket = null;
        let audioContext = null;
        let mediaStream = null;
        let processorNode = null;
        let isLiveActive = false;

        function triggerUpload() {
            fileInput.click();
        }

        fileInput.addEventListener('change', function() {
            if (this.files && this.files[0]) {
                const file = this.files[0];
                selectedMimeType = file.type || "image/jpeg";
                
                const reader = new FileReader();
                reader.onload = function(e) {
                    selectedFileBase64 = e.target.result;
                    plusBtn.textContent = "✓";
                    plusBtn.classList.add('attached');
                }
                reader.readAsDataURL(file);
            }
        });

        // NEXUS LIVE VOICE STREAM PROTOCOL
        async function toggleLiveAudio() {
            if (isLiveActive) {
                stopLiveSession("NEXUS Live session disconnected.");
                return;
            }

            appendSystemBotMessage("Connecting to NEXUS Live Session...");
            micBtn.classList.add('live-active');
            isLiveActive = true;

            try {
                const wsUrl = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=${API_KEY}`;
                liveSocket = new WebSocket(wsUrl);

                liveSocket.onopen = () => {
                    appendSystemBotMessage("🎙️ NEXUS Live Session Connected! Start speaking...");
                    
                    const setupMessage = {
                        setup: {
                            model: "models/gemini-2.5-flash",
                            responseModalities: ["AUDIO"],
                            systemInstruction: { parts: [{ text: SYSTEM_INSTRUCTION }] },
                            speechConfig: {
                                voiceConfig: { prebuiltVoiceConfig: { voiceName: "Puck" } }
                            }
                        }
                    };
                    liveSocket.send(JSON.stringify(setupMessage));
                    startMicrophoneRecording();
                };

                liveSocket.onmessage = async (event) => {
                    const response = JSON.parse(event.data);
                    if (response.serverContent?.modelTurn?.parts) {
                        for (const part of response.serverContent.modelTurn.parts) {
                            if (part.inlineData && part.inlineData.data) {
                                playAudioChunk(part.inlineData.data);
                            }
                        }
                    }
                };

                liveSocket.onerror = (err) => {
                    console.error(err);
                    stopLiveSession("Voice session dropped due to connection error.");
                };

                liveSocket.onclose = () => {
                    if(isLiveActive) stopLiveSession("Live connection closed.");
                };

            } catch (e) {
                console.error(e);
                stopLiveSession("Could not access microphone.");
            }
        }

        async function startMicrophoneRecording() {
            audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
            mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const source = audioContext.createMediaStreamSource(mediaStream);
            
            processorNode = audioContext.createScriptProcessor(2048, 1, 1);
            source.connect(processorNode);
            processorNode.connect(audioContext.destination);

            processorNode.onaudioprocess = (e) => {
                if (!isLiveActive || liveSocket.readyState !== WebSocket.OPEN) return;
                
                const inputData = e.inputBuffer.getChannelData(0);
                const pcmBuffer = new Int16Array(inputData.length);
                for (let i = 0; i < inputData.length; i++) {
                    pcmBuffer[i] = Math.min(1, Math.max(-1, inputData[i])) * 0x7FFF;
                }
                
                const binaryStr = String.fromCharCode.apply(null, new Uint8Array(pcmBuffer.buffer));
                const base64Audio = btoa(binaryStr);

                const audioMessage = {
                    realtimeInput: {
                        mediaChunks: [{
                            mimeType: "audio/pcm;rate=16000",
                            data: base64Audio
                        }]
                    }
                };
                liveSocket.send(JSON.stringify(audioMessage));
            };
        }

        function playAudioChunk(base64Data) {
            const binaryString = atob(base64Data);
            const len = binaryString.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            const pcmInt16 = new Int16Array(bytes.buffer);
            const float32 = new Float32Array(pcmInt16.length);
            for (let i = 0; i < pcmInt16.length; i++) {
                float32[i] = pcmInt16[i] / 0x7FFF;
            }

            const ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
            const buffer = ctx.createBuffer(1, float32.length, 24000);
            buffer.getChannelData(0).set(float32);
            const source = ctx.createBufferSource();
            source.buffer = buffer;
            source.connect(ctx.destination);
            source.start();
        }

        function stopLiveSession(statusMessage) {
            isLiveActive = false;
            micBtn.classList.remove('live-active');
            if (processorNode) { processorNode.disconnect(); processorNode = null; }
            if (mediaStream) { mediaStream.getTracks().forEach(track => track.stop()); mediaStream = null; }
            if (audioContext) { audioContext.close(); audioContext = null; }
            if (liveSocket) { liveSocket.close(); liveSocket = null; }
            appendSystemBotMessage(statusMessage || "Voice session turned off.");
        }

        function appendSystemBotMessage(messageText) {
            const botDiv = document.createElement('div');
            botDiv.className = 'message bot-message';
            botDiv.style.fontStyle = 'italic';
            botDiv.style.borderColor = '#8b5cf6';
            botDiv.textContent = messageText;
            chatContainer.appendChild(botDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // TEXT + IMAGE GENERATION CONTROLLER
        async function sendMessage() {
            const text = chatMsg.value.trim();
            if (!text && !selectedFileBase64) return;

            const currentText = text;
            const currentFileBase64 = selectedFileBase64;
            const currentMimeType = selectedMimeType;

            const userDiv = document.createElement('div');
            userDiv.className = 'message user-message';
            if (currentText) userDiv.textContent = currentText;
            
            if (currentFileBase64) {
                const img = document.createElement('img');
                img.src = currentFileBase64;
                img.className = 'attachment-preview';
                userDiv.appendChild(img);
            }

            chatContainer.appendChild(userDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            chatMsg.value = '';
            selectedFileBase64 = null;
            fileInput.value = '';
            plusBtn.textContent = "+";
            plusBtn.classList.remove('attached');

            const loaderDiv = document.createElement('div');
            loaderDiv.className = 'message bot-message';
            loaderDiv.id = 'nexus-loader';
            loaderDiv.innerHTML = `<div class="typing-loader"><span></span><span></span><span></span></div>`;
            chatContainer.appendChild(loaderDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const parts = [];
                if (currentText) {
                    parts.push({ text: currentText });
                }
                
                if (currentFileBase64) {
                    let cleanBase64 = currentFileBase64.includes(",") ? currentFileBase64.split(",")[1] : currentFileBase64;
                    
                    parts.push({
                        inlineData: {
                            mimeType: currentMimeType,
                            data: cleanBase64
                        }
                    });
                }

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        contents: [{ parts: parts }],
                        systemInstruction: { parts: [{ text: SYSTEM_INSTRUCTION }] }
                    })
                });

                const data = await response.json();
                document.getElementById('nexus-loader').remove();

                const botDiv = document.createElement('div');
                botDiv.className = 'message bot-message';
                
                // If response is successful and contains text
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    botDiv.textContent = data.candidates[0].content.parts[0].text;
                } else if (data.error) {
                    // Prints the exact error from Google so you know if your key is revoked!
                    botDiv.textContent = "API Error: " + data.error.message + " (Status code: " + data.error.status + ")";
                } else {
                    botDiv.textContent = "Sorry, I had trouble processing that response layout.";
                }
                
                chatContainer.appendChild(botDiv);
                chatContainer.scrollTop = chatContainer.scrollHeight;

            } catch (error) {
                console.error(error);
                if(document.getElementById('nexus-loader')) document.getElementById('nexus-loader').remove();
                
                const errorDiv = document.createElement('div');
                errorDiv.className = 'message bot-message';
                errorDiv.textContent = "Network request failed. Error: " + error.message;
                chatContainer.appendChild(errorDiv);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
        }
    </script>
</body>
</html>
