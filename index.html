<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        /* Modern Dark Theme Base Setup */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #131314;

            height: 100vh;
            overflow: hidden;
            text-align: center;
        }

            max-width: 600px;
            padding: 20px;
        }
        h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 15px;
            background: linear-gradient(to right, #4285f4, #9b51e0, #e91e63);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.05em;
        }
        p {
            font-size: 1.2rem;
            color: #80868b;
            line-height: 1.6;
        }
        /* Styling adjustments for Coze widget layout if needed */
        .coze-webchat-client-wrapper {
